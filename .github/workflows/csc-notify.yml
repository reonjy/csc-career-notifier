# CSC Career Portal → Telegram
# Scrapes with Selenium (Chrome) and notifies on NEW jobs.
#
# Secrets:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (required)
#   CSC_POSITION / CSC_REGION / CSC_SEARCH (optional)
#   RESEND_ALL / SEND_ON_FIRST_RUN (optional secrets; default false)
#
# External cron (recommended): see EXTERNAL_CRON.md
#   POST body: {"ref":"main"}
# CSC Selenium runs are slow (~5–15 min) → poll every 30 minutes, not 15.

name: CSC Career Telegram Notify

on:
  schedule:
    # Weak backup only (GitHub free-tier often skips)
    - cron: "12,42 * * * *"
  # No inputs — keeps external cron body minimal: {"ref":"main"}
  workflow_dispatch:
  repository_dispatch:
    types: [poll]

permissions:
  contents: write
  actions: write

concurrency:
  group: csc-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          google-chrome --version || chromium --version || true

      - name: Restore seen-job state (cache)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: csc-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            csc-seen-

      - name: Restore seen-job state (git branch)
        run: |
          mkdir -p state
          git fetch origin state:refs/remotes/origin/state 2>/dev/null || true
          if git show origin/state:seen_jobs.json > /tmp/seen_from_branch.json 2>/dev/null; then
            BRANCH_COUNT=$(python -c "import json; d=json.load(open('/tmp/seen_from_branch.json')); print(len(d.get('seen_ids',[])))")
            CACHE_COUNT=0
            if [ -f state/seen_jobs.json ]; then
              CACHE_COUNT=$(python -c "import json; d=json.load(open('state/seen_jobs.json')); print(len(d.get('seen_ids',[])))")
            fi
            echo "Branch seen IDs: $BRANCH_COUNT | Cache seen IDs: $CACHE_COUNT"
            if [ "$BRANCH_COUNT" -ge "$CACHE_COUNT" ]; then
              cp /tmp/seen_from_branch.json state/seen_jobs.json
              echo "Using state branch copy"
            else
              echo "Keeping cache copy (more IDs)"
            fi
          else
            echo "No state branch yet (will create after poll)"
          fi

      - name: Poll CSC and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CSC_POSITION: ${{ secrets.CSC_POSITION }}
          CSC_REGION: ${{ secrets.CSC_REGION }}
          CSC_SEARCH: ${{ secrets.CSC_SEARCH }}
          CSC_AGENCY: ${{ secrets.CSC_AGENCY }}
          HEADLESS: "true"
          STATE_FILE: state/seen_jobs.json
          RESEND_ALL: ${{ secrets.RESEND_ALL || 'false' }}
          SEND_ON_FIRST_RUN: ${{ secrets.SEND_ON_FIRST_RUN || 'false' }}
          MAX_SEND_PER_RUN: "40"
        run: |
          mkdir -p state
          export CSC_POSITION="${CSC_POSITION:-administrative}"
          export CSC_REGION="${CSC_REGION:-Region VII}"
          export CSC_SEARCH="${CSC_SEARCH:-Cebu}"
          echo "=== Poll start $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Dispatch type: ${{ github.event.action }}"
          fi
          echo "Filters: position=$CSC_POSITION region=$CSC_REGION search=$CSC_SEARCH"
          echo "SEND_ON_FIRST_RUN=$SEND_ON_FIRST_RUN RESEND_ALL=$RESEND_ALL"
          if [ -f state/seen_jobs.json ]; then
            echo "Seen state size: $(wc -c < state/seen_jobs.json) bytes"
          else
            echo "No seen state yet"
          fi
          ls -la state || true
          python notify.py --once
          echo "=== Poll end $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

      - name: Save seen-job state (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: csc-seen-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist seen-job state (git branch)
        if: always()
        run: |
          if [ ! -f state/seen_jobs.json ]; then
            echo "No state file to persist"
            exit 0
          fi
          WORK=/tmp/csc-state
          rm -rf "$WORK"
          if git fetch origin state:refs/remotes/origin/state 2>/dev/null; then
            git worktree add -B state "$WORK" origin/state
          else
            git worktree add --detach "$WORK"
            git -C "$WORK" checkout --orphan state
            git -C "$WORK" rm -rf . 2>/dev/null || true
          fi
          cp state/seen_jobs.json "$WORK/seen_jobs.json"
          git -C "$WORK" config user.name "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add seen_jobs.json
          if git -C "$WORK" diff --cached --quiet; then
            echo "State unchanged — skip commit"
          else
            git -C "$WORK" commit -m "chore: update CSC seen job IDs ($(date -u +%Y-%m-%dT%H:%MZ))"
            git -C "$WORK" push origin state
            echo "Pushed state branch"
          fi
