# CSC Career Portal → Telegram
# Scrapes with Selenium (Chrome) on a schedule and notifies on NEW jobs.
#
# Secrets (Settings → Secrets → Actions):
#   TELEGRAM_BOT_TOKEN  (required)
#   TELEGRAM_CHAT_ID    (required)
# Optional:
#   CSC_POSITION (default: administrative)
#   CSC_REGION   (default: Region VII)
#   CSC_SEARCH   (default: Cebu)
#
# Note: cron is UTC. Free GitHub schedules can lag. Use "Run workflow" for an immediate poll.

name: CSC Career Telegram Notify

on:
  schedule:
    # Every hour at :00 UTC (may lag on free tier)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      resend_all:
        description: "Send ALL current matches this run (ignore seen list)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_on_first_run:
        description: "If seen list is empty, send current matches instead of only seeding"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          google-chrome --version || chromium --version || true

      # Same fix as OnlineJobs: restore + separate save so seen IDs always persist
      - name: Restore seen-job state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: csc-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            csc-seen-

      - name: Poll CSC and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CSC_POSITION: ${{ secrets.CSC_POSITION }}
          CSC_REGION: ${{ secrets.CSC_REGION }}
          CSC_SEARCH: ${{ secrets.CSC_SEARCH }}
          CSC_AGENCY: ${{ secrets.CSC_AGENCY }}
          HEADLESS: "true"
          STATE_FILE: state/seen_jobs.json
          RESEND_ALL: ${{ github.event.inputs.resend_all || secrets.RESEND_ALL || 'false' }}
          SEND_ON_FIRST_RUN: ${{ github.event.inputs.send_on_first_run || secrets.SEND_ON_FIRST_RUN || 'false' }}
          MAX_SEND_PER_RUN: "40"
        run: |
          mkdir -p state
          export CSC_POSITION="${CSC_POSITION:-administrative}"
          export CSC_REGION="${CSC_REGION:-Region VII}"
          export CSC_SEARCH="${CSC_SEARCH:-Cebu}"
          echo "=== Poll start $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          echo "Filters: position=$CSC_POSITION region=$CSC_REGION search=$CSC_SEARCH"
          echo "SEND_ON_FIRST_RUN=$SEND_ON_FIRST_RUN RESEND_ALL=$RESEND_ALL"
          if [ -f state/seen_jobs.json ]; then
            echo "Seen state size: $(wc -c < state/seen_jobs.json) bytes"
          else
            echo "No seen state yet"
          fi
          ls -la state || true
          python notify.py --once
          echo "=== Poll end $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

      - name: Save seen-job state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: csc-seen-${{ github.run_id }}-${{ github.run_attempt }}
